# Light palette. It also serves as the base for every theme with base = "light",
# so it must define all colors.
name = "Cutlery Light"
author = "Cutlery"
base = "light"

[colors]
window-bg = "#f4f4f7"
window-border = "#c9c9d2"
surface = "#ffffff"
surface-hover = "#f0f0f5"
surface-sunken = "#e9e9ef"
overlay-bg = "#ffffff"
border = "#dcdce4"
border-strong = "#c4c4cf"
scrim = "#1a1a2066"
shadow = "#00000040"
hover-tint = "#0000000f"
status-glass = "#ffffffb3"
card-glass = "#ffffffcc"
sidebar-glass = "#ffffffa6"
hero-top = "#ffffffb3"
hero-bottom = "#ffffffbf"
text = "#17171c"
text-soft = "#17171ce6"
text-muted = "#5b5f6b"
text-faint = "#8b8f9a"
ok = "#059669"
info = "#0284c7"
warn = "#b45309"
danger = "#dc2626"
