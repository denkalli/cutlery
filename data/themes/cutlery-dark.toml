# Cutlery's default palette. It also serves as the base for every theme with base = "dark",
# so it must define all colors.
name = "Cutlery Dark"
author = "Cutlery"
base = "dark"

[colors]
window-bg = "#202024"
window-border = "#050404"
surface = "#28282e"
surface-hover = "#2f2f37"
surface-sunken = "#1b1b1f"
overlay-bg = "#1e1e26"
border = "#34343c"
border-strong = "#42424e"
scrim = "#00000099"
shadow = "#000000"
hover-tint = "#ffffff14"
status-glass = "#00000066"
card-glass = "#00000080"
sidebar-glass = "#00000059"
hero-top = "#00000099"
hero-bottom = "#000000a6"
text = "#ffffff"
text-soft = "#ffffffe6"
text-muted = "#9ca3af"
text-faint = "#6b7280"
ok = "#34d399"
info = "#38bdf8"
warn = "#fbbf24"
danger = "#f87171"
