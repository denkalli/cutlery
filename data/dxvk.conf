# DXVK Configuration for Roblox Studio
# Optimized for asynchronous pipeline compilation and low-latency render thread

dxvk.enableAsync = true
dxvk.gpl = true
dxvk.numCompilerThreads = 0
dxvk.syncInterval = 0
dxvk.tearFree = false
dxvk.maxChunkSize = 128

# Enable DirectComposition dummy swapchain so QtitanDocking composition overlays and drop targets succeed
dxgi.enableDummyCompositionSwapchain = true
