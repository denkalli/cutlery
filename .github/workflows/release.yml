name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every package and upload them as workflow artifacts, without releasing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Standalone Assets
    # Pinned so `snapcraft --destructive-mode` builds on the same Ubuntu as the core24 base.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev gcc-multilib libx11-dev:i386

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and package release assets
        run: |
          chmod +x scripts/package_release.sh scripts/package_formats.sh
          ./scripts/package_release.sh

      - name: Build AppImage
        run: ./scripts/package_formats.sh appimage

      - name: Build Snap
        run: |
          sudo snap install snapcraft --classic
          sudo ./scripts/package_formats.sh snap
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cutlery-packages
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.snap
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.snap
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
