[package]
name = "cutlery"
version = "1.1.0"
edition = "2021"
description = "A lightweight Roblox Studio launcher for Linux with native rootless docking fixes and Universal AI MCP Bridge"
authors = ["Cutlery Contributors", "Gemini <gemini@google.com>"]
license = "GPL-3.0-or-later"

[[bin]]
name = "cutlery"
path = "src/main.rs"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
