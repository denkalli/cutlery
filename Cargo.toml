[package]
name = "cutlery"
version = "1.0.0"
edition = "2021"
description = "A lightweight Roblox Studio launcher for Linux with native rootless docking fixes and Universal AI MCP Bridge"
authors = ["Cutlery Contributors"]
license = "GPL-3.0-or-later"

[[bin]]
name = "cutlery"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
